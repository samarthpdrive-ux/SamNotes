<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamNotes — Ultimate Note & Canvas Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="sidebarToggle" class="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 p-2 rounded-lg focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-feather-pointed text-sm"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-indigo-500 to-violet-600 bg-clip-text text-transparent">SamNotes</h1>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Search Bar -->
            <div class="relative hidden sm:block">
                <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search notes..." class="pl-9 pr-4 py-1.5 text-sm bg-slate-100 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-indigo-500 w-48 lg:w-64 outline-none">
            </div>

            <!-- Theme Toggle -->
            <button id="themeToggle" class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 rounded-lg">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            </button>

            <!-- Export / Import Buttons -->
            <button onclick="exportData()" title="Export Backup" class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 rounded-lg">
                <i class="fa-solid fa-download"></i>
            </button>
            <label title="Import Backup" class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 rounded-lg cursor-pointer">
                <i class="fa-solid fa-upload"></i>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
            </label>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar: Note List & Folders -->
        <aside id="sidebar" class="w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0 transition-all duration-300 z-10">
            <div class="p-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Notes Collection</span>
                <button onclick="createNewNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg flex items-center space-x-1.5 shadow-sm transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Note</span>
                </button>
            </div>

            <!-- Notes List Container -->
            <div id="notesList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60">
                <!-- Dynamically populated -->
            </div>

            <!-- Sidebar Footer Status -->
            <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-400 flex justify-between items-center">
                <span id="noteCount">0 notes</span>
                <button onclick="clearAllNotes()" class="text-rose-500 hover:underline">Clear All</button>
            </div>
        </aside>

        <!-- Main Editor & Workspace Area -->
        <main class="flex-1 flex flex-col bg-white dark:bg-slate-950 overflow-hidden">
            
            <!-- Note Toolbar / Metadata -->
            <div class="border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 bg-slate-50/50 dark:bg-slate-900/50">
                <div class="flex items-center space-x-2 flex-1 min-w-[200px]">
                    <input type="text" id="noteTitle" placeholder="Untitled Note..." class="font-bold text-lg bg-transparent border-none outline-none w-full focus:ring-0">
                </div>

                <!-- Action Controls -->
                <div class="flex items-center space-x-1 sm:space-x-2">
                    <!-- Mode Switcher (Editor vs Canvas) -->
                    <div class="bg-slate-200 dark:bg-slate-800 p-1 rounded-lg flex space-x-1">
                        <button id="modeEditorBtn" onclick="switchMode('editor')" class="px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-700 shadow-sm transition-all">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> Editor
                        </button>
                        <button id="modeCanvasBtn" onclick="switchMode('canvas')" class="px-3 py-1 text-xs font-medium rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 transition-all">
                            <i class="fa-solid fa-paintbrush mr-1"></i> Free Canvas
                        </button>
                    </div>

                    <!-- Delete Note -->
                    <button onclick="deleteCurrentNote()" class="p-2 text-slate-400 hover:text-rose-500 rounded-lg transition-colors" title="Delete Note">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- Component Insertion Toolbar (Only active in Editor mode) -->
            <div id="componentToolbar" class="bg-slate-100 dark:bg-slate-900/80 px-4 py-2 border-b border-slate-200 dark:border-slate-800 flex items-center space-x-1.5 overflow-x-auto text-xs">
                <span class="text-slate-400 font-semibold mr-1 uppercase text-[10px]">Insert Component:</span>
                <button onclick="insertComponent('callout')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2.5 py-1 rounded-md hover:border-indigo-500 transition-all flex items-center space-x-1 shadow-2xs">
                    <i class="fa-solid fa-circle-info text-indigo-500"></i><span>Callout</span>
                </button>
                <button onclick="insertComponent('task')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2.5 py-1 rounded-md hover:border-indigo-500 transition-all flex items-center space-x-1 shadow-2xs">
                    <i class="fa-solid fa-square-check text-emerald-500"></i><span>Task List</span>
                </button>
                <button onclick="insertComponent('code')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2.5 py-1 rounded-md hover:border-indigo-500 transition-all flex items-center space-x-1 shadow-2xs">
                    <i class="fa-solid fa-code text-amber-500"></i><span>Code Block</span>
                </button>
                <button onclick="insertComponent('divider')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2.5 py-1 rounded-md hover:border-indigo-500 transition-all flex items-center space-x-1 shadow-2xs">
                    <i class="fa-solid fa-minus text-slate-500"></i><span>Divider</span>
                </button>
                <button onclick="insertComponent('quote')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-2.5 py-1 rounded-md hover:border-indigo-500 transition-all flex items-center space-x-1 shadow-2xs">
                    <i class="fa-solid fa-quote-left text-purple-500"></i><span>Quote</span>
                </button>
            </div>

            <!-- Workspace Core Panes -->
            <div class="flex-1 relative overflow-hidden flex">
                
                <!-- 1. Text Editor & Live Preview Mode -->
                <div id="editorWorkspace" class="flex-1 flex flex-col md:flex-row h-full w-full overflow-hidden">
                    <!-- Text Area (Markdown Input) -->
                    <div class="flex-1 h-full border-r border-slate-200 dark:border-slate-800 flex flex-col">
                        <textarea id="noteContent" placeholder="Start writing your thoughts in Markdown or use components above..." class="flex-1 p-4 bg-transparent outline-none resize-none font-mono text-sm leading-relaxed"></textarea>
                    </div>
                    <!-- Live Markdown Previewer -->
                    <div class="flex-1 h-full overflow-y-auto p-6 bg-slate-50/50 dark:bg-slate-900/30 prose dark:prose-invert max-w-none" id="notePreview">
                        <!-- Rendered preview output -->
                    </div>
                </div>

                <!-- 2. Freehand Drawing / Canvas Mode -->
                <div id="canvasWorkspace" class="hidden flex-1 flex flex-col h-full w-full bg-slate-900 relative">
                    <!-- Canvas Toolbar -->
                    <div class="absolute top-4 left-4 z-10 bg-slate-800/90 backdrop-blur-md border border-slate-700 p-2 rounded-xl flex items-center space-x-3 shadow-lg">
                        <div class="flex items-center space-x-1">
                            <button onclick="setTool('pen')" id="toolPen" class="p-2 rounded-lg bg-indigo-600 text-white text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="setTool('eraser')" id="toolEraser" class="p-2 rounded-lg text-slate-300 hover:bg-slate-700 text-xs"><i class="fa-solid fa-eraser"></i></button>
                        </div>
                        <div class="h-4 w-px bg-slate-700"></div>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="setPenColor('#ffffff')" class="w-5 h-5 rounded-full bg-white ring-2 ring-indigo-500"></button>
                            <button onclick="setPenColor('#6366f1')" class="w-5 h-5 rounded-full bg-indigo-500"></button>
                            <button onclick="setPenColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500"></button>
                            <button onclick="setPenColor('#f59e0b')" class="w-5 h-5 rounded-full bg-amber-500"></button>
                            <button onclick="setPenColor('#ef4444')" class="w-5 h-5 rounded-full bg-rose-500"></button>
                        </div>
                        <div class="h-4 w-px bg-slate-700"></div>
                        <input type="range" id="penSize" min="1" max="20" value="3" class="w-20 accent-indigo-500">
                        <button onclick="clearCanvas()" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1"><i class="fa-solid fa-rotate-right mr-1"></i>Reset</button>
                    </div>
                    <canvas id="sketchCanvas" class="flex-1 cursor-crosshair w-full h-full"></canvas>
                </div>

            </div>
        </main>
    </div>

    <!-- Application JavaScript -->
    <script>
        // State Management
        let notes = JSON.parse(localStorage.getItem('sam_notes')) || [
            { id: 1, title: 'Welcome to SamNotes 👋', content: '# Welcome!\n\nSamNotes has been supercharged with:\n- **Rich Markdown Live Preview**\n- **Component Adders** (Callouts, Task lists, Code blocks)\n- **Free Drawing Canvas Mode**\n\n> Try adding components from the toolbar above!', canvasData: null, updatedAt: Date.now() }
        ];
        let currentNoteId = notes[0] ? notes[0].id : null;
        let currentMode = 'editor'; // 'editor' or 'canvas'
        
        // Canvas Setup variables
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let currentTool = 'pen';
        let penColor = '#ffffff';
        let penWidth = 3;

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderNotesList();
            if (currentNoteId) loadNote(currentNoteId);
            setupEventListeners();
            initCanvas();
        });

        function setupEventListeners() {
            document.getElementById('noteTitle').addEventListener('input', (e) => {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.title = e.target.value;
                    note.updatedAt = Date.now();
                    saveNotes();
                    renderNotesList(false);
                }
            });

            document.getElementById('noteContent').addEventListener('input', (e) => {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.content = e.target.value;
                    note.updatedAt = Date.now();
                    updatePreview(note.content);
                    saveNotes();
                }
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                renderNotesList(true, e.target.value);
            });

            document.getElementById('sidebarToggle').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('hidden');
            });

            document.getElementById('themeToggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('sam_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            });
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('sam_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Render Sidebar Notes List
        function renderNotesList(preserveScroll = false, searchQuery = '') {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';

            const filteredNotes = notes
                .filter(n => n.title.toLowerCase().includes(searchQuery.toLowerCase()) || n.content.toLowerCase().includes(searchQuery.toLowerCase()))
                .sort((a, b) => b.updatedAt - a.updatedAt);

            document.getElementById('noteCount').innerText = `${filteredNotes.length} notes`;

            if (filteredNotes.length === 0) {
                listEl.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No notes found</div>`;
                return;
            }

            filteredNotes.forEach(note => {
                const isSelected = note.id === currentNoteId;
                const div = document.createElement('div');
                div.className = `p-3 cursor-pointer transition-colors flex flex-col space-y-1 ${isSelected ? 'bg-indigo-50 dark:bg-indigo-950/40 border-l-4 border-indigo-600' : 'hover:bg-slate-100 dark:hover:bg-slate-900/60'}`;
                div.onclick = () => selectNote(note.id);

                const dateStr = new Date(note.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-medium text-sm truncate ${isSelected ? 'text-indigo-600 dark:text-indigo-400' : ''}">${note.title || 'Untitled Note'}</span>
                        <span class="text-[10px] text-slate-400">${dateStr}</span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${note.content.replace(/[#*`_]/g, '') || 'Empty note...'}</p>
                `;
                listEl.appendChild(div);
            });
        }

        function selectNote(id) {
            currentNoteId = id;
            loadNote(id);
            renderNotesList();
        }

        function loadNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            updatePreview(note.content);

            if (note.canvasData) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = note.canvasData;
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: 'New Note',
                content: '',
                canvasData: null,
                updatedAt: Date.now()
            };
            notes.unshift(newNote);
            currentNoteId = newNote.id;
            saveNotes();
            renderNotesList();
            loadNote(currentNoteId);
            document.getElementById('noteTitle').focus();
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                alert("You need at least one note!");
                return;
            }
            if (confirm("Are you sure you want to delete this note?")) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = notes[0].id;
                saveNotes();
                renderNotesList();
                loadNote(currentNoteId);
            }
        }

        function clearAllNotes() {
            if (confirm("Delete all notes? This cannot be undone.")) {
                notes = [{ id: Date.now(), title: 'Welcome Note', content: 'Start fresh!', canvasData: null, updatedAt: Date.now() }];
                currentNoteId = notes[0].id;
                saveNotes();
                renderNotesList();
                loadNote(currentNoteId);
            }
        }

        function updatePreview(markdownText) {
            document.getElementById('notePreview').innerHTML = marked.parse(markdownText || '');
        }

        function saveNotes() {
            localStorage.setItem('sam_notes', JSON.stringify(notes));
        }

        // Component Insertions
        function insertComponent(type) {
            const textarea = document.getElementById('noteContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            let snippet = '';

            switch(type) {
                case 'callout':
                    snippet = `\n> 💡 **Callout Title**\n> Write your highlighted callout text information here.\n`;
                    break;
                case 'task':
                    snippet = `\n- [ ] Task item one\n- [ ] Task item two\n- [x] Completed task item\n`;
                    break;
                case 'code':
                    snippet = `\n\`\`\`javascript\n// Write your code snippet here\nconsole.log("Hello SamNotes!");\n\`\`\`\n`;
                    break;
                case 'divider':
                    snippet = `\n---\n`;
                    break;
                case 'quote':
                    snippet = `\n> "Simplicity is the ultimate sophistication." — Leonardo da Vinci\n`;
                    break;
            }

            textarea.value = textarea.value.substring(0, start) + snippet + textarea.value.substring(end);
            textarea.focus();
            
            // Trigger update
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.content = textarea.value;
                note.updatedAt = Date.now();
                updatePreview(note.content);
                saveNotes();
            }
        }

        // Mode Switching (Editor vs Canvas)
        function switchMode(mode) {
            currentMode = mode;
            const editorWorkspace = document.getElementById('editorWorkspace');
            const canvasWorkspace = document.getElementById('canvasWorkspace');
            const componentToolbar = document.getElementById('componentToolbar');
            const editorBtn = document.getElementById('modeEditorBtn');
            const canvasBtn = document.getElementById('modeCanvasBtn');

            if (mode === 'editor') {
                editorWorkspace.classList.remove('hidden');
                canvasWorkspace.classList.add('hidden');
                componentToolbar.classList.remove('hidden');
                editorBtn.className = "px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-700 shadow-sm transition-all";
                canvasBtn.className = "px-3 py-1 text-xs font-medium rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 transition-all";
            } else {
                editorWorkspace.classList.add('hidden');
                canvasWorkspace.classList.remove('hidden');
                componentToolbar.classList.add('hidden');
                canvasBtn.className = "px-3 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-700 shadow-sm transition-all";
                editorBtn.className = "px-3 py-1 text-xs font-medium rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 transition-all";
                resizeCanvas();
            }
        }

        // Canvas Drawing Logic
        function initCanvas() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            // Touch support for mobiles/tablets
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
            canvas.addEventListener('touchend', stopDrawing);

            document.getElementById('penSize').addEventListener('input', (e) => {
                penWidth = e.target.value;
            });
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.drawImage(tempCanvas, 0, 0);
        }

        function startDrawing(e) {
            drawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = penWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#020617' : '#f8fafc';
                ctx.lineWidth = penWidth * 3;
            } else {
                ctx.strokeStyle = penColor;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function stopDrawing() {
            if (!drawing) return;
            drawing = false;
            // Save canvas image state into current note
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.canvasData = canvas.toDataURL();
                note.updatedAt = Date.now();
                saveNotes();
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('toolPen').className = tool === 'pen' ? "p-2 rounded-lg bg-indigo-600 text-white text-xs" : "p-2 rounded-lg text-slate-300 hover:bg-slate-700 text-xs";
            document.getElementById('toolEraser').className = tool === 'eraser' ? "p-2 rounded-lg bg-indigo-600 text-white text-xs" : "p-2 rounded-lg text-slate-300 hover:bg-slate-700 text-xs";
        }

        function setPenColor(color) {
            penColor = color;
            setTool('pen');
        }

        function clearCanvas() {
            if (confirm("Clear canvas drawings?")) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.canvasData = null;
                    note.updatedAt = Date.now();
                    saveNotes();
                }
            }
        }

        // Export and Import Data
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `SamNotes_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const importedNotes = JSON.parse(e.target.result);
                        if (Array.isArray(importedNotes)) {
                            notes = importedNotes;
                            currentNoteId = notes[0] ? notes[0].id : null;
                            saveNotes();
                            renderNotesList();
                            if (currentNoteId) loadNote(currentNoteId);
                            alert("Notes successfully imported!");
                        }
                    } catch (err) {
                        alert("Invalid backup file format.");
                    }
                };
            }
        }
    </script>
</body>
</html>
